name: Host-free qualification
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12 runs the integration (the default: listed last); 3.13 is the Strata lock's Python for `dev-env`
          python-version: |
            3.13
            3.12
      - run: python3 scripts/check_public_hygiene.py
      - run: python3 -m compileall -q omp_strata scripts tests
      - run: python3 scripts/omp_strata.py validate --profile profiles/win11-rtx5090-coder-iq1m-131k.json
      - run: python3 scripts/verify_release.py --manifest releases/win11-rtx5090-coder-iq1m-131k/manifest.json
      - name: Windows scripts parse (pwsh)
        shell: pwsh
        run: |
          $bad = @()
          foreach ($script in Get-ChildItem scripts/windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            $bad += $errors | ForEach-Object { "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
          }
          if ($bad) { $bad; exit 1 }
      - name: Unit, mock and composed tests (pinned OMP binary, pinned Strata frontend)
        run: python3 scripts/omp_strata.py dev-env --profile profiles/win11-rtx5090-coder-iq1m-131k.json --root "$RUNNER_TEMP/omp-strata" -- python3 -m unittest discover -s tests -t . -v
