name: Host-free qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12 runs the integration (the default: listed last); 3.13 is the Strata lock's Python for `dev-env`
          python-version: |
            3.13
            3.12
      - run: python3 scripts/check_public_hygiene.py
      - run: python3 -m compileall -q omp_strata scripts tests
      - name: Validate every profile and client route, and verify every release ledger
        run: |
          for profile in profiles/*.json routes/*.json; do python3 scripts/omp_strata.py validate --profile "$profile"; done
          for manifest in releases/*/manifest.json; do python3 scripts/verify_release.py --manifest "$manifest"; done
      - name: Generated support matrix is current and QUICKSTART commands parse
        run: |
          python3 scripts/render_compatibility.py --check
          python3 scripts/documented_route.py --check
      - name: Windows scripts parse (pwsh)
        shell: pwsh
        run: |
          $bad = @()
          foreach ($script in Get-ChildItem scripts/windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            $bad += $errors | ForEach-Object { "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
          }
          if ($bad) { $bad; exit 1 }
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each host's current and rollback profile and the qualified opt-in with its rollback (docs/OPERATIONS.md), plus
        # any draft being qualified. Held drafts are excluded. Older profiles keep their ledgers, verified by
        # `checks`, and run locally through `dev-env`.
        profile:
          - win11-rtxpro6000-iq3s-262k-slots4-parking-strata0.2.7-omp18.13.2
          - win11-rtxpro6000-iq3s-262k-slots4-parking-strata0.2.3-omp18.12.6
          - win11-rtx5090-coder-iq1m-131k-strata0.2.7-omp18.13.2
          - win11-rtx5090-coder-iq1m-131k-strata0.2.3-omp18.12.6
          - win11-rtx5090-coder-iq1m-262k-strata0.2.3-omp18.12.6
          - win11-rtx5090-coder-iq1m-262k-strata0.2.1-omp18.10.1
          - win11-rtx3090-rtx4090-iq3s-262k-pw2-disp4090-roles-parking-strata0.2.3-omp18.12.6
          - win11-rtx3090-rtx4090-iq3s-262k-pw2-disp4090-parking-strata0.2.1-omp18.10.1
    steps:
      - *checkout
      - *setup-python
      - name: Unit, mock and composed tests
        env:
          PROFILE: profiles/${{ matrix.profile }}.json
        run: python3 scripts/omp_strata.py dev-env --profile "$PROFILE" --root "$RUNNER_TEMP/omp-strata" -- python3 -m unittest discover -s tests -t . -v
